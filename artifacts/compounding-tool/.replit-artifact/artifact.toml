kind = "web"
previewPath = "/"
title = "Compounding Tool"
version = "1.0.0"
id = "artifacts/compounding-tool"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21519

[services.development]
run = "pnpm --filter @workspace/compounding-tool run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/compounding-tool", "run", "build" ]
publicDir = "artifacts/compounding-tool/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21519"
BASE_PATH = "/"
