# Netlify builds only the static calculator. The API server is not deployed.
[build]
  command = "pnpm --filter @workspace/compounding-tool run build"
  publish = "artifacts/compounding-tool/dist/public"

[build.environment]
  NODE_VERSION = "22"
  # vite.config.ts throws without these
  PORT = "5173"
  BASE_PATH = "/"
